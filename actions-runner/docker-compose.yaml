services:
  github-runner:
#    build: .
    # image: gh-runner
    container_name: github-actions-runner
    restart: unless-stopped

    volumes:
      # lets CI jobs start host containers (e.g. the selenoid1 stack)
      - "/var/run/docker.sock:/var/run/docker.sock"

    environment:
      GITHUB_URL: "https://github.com/PAG-0418/AI-BOT"
      RUNNER_TOKEN: "${RUNNER_TOKEN}"
      RUNNER_NAME: "local-docker-runner2"
      RUNNER_LABELS: "local-service"